project: Route 25 AM peak frequency increase (dummy project)
tags:
   - 'example'
transit_property_change:
  service:
    trip_properties:
      route_id: [SF:25]
      direction_id: 1  # toward the Transit Center in San Francisco, i.e. westbound on the Bay Bridge
    timespans: [['06:00', '10:00']]  # MTC AM period, the same window as the bus lane
  property_changes:
    headway_secs:
      set: 900  # every 15 minutes
notes: >-
  Runs Route 25 every 15 minutes in the AM peak (06:00-10:00) toward the Transit Center, which
  is westbound over the Bay Bridge. Companion to the I-80 westbound AM peak bus lane project,
  which dedicates a lane to buses in the same window.